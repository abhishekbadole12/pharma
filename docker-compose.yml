version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: pharma_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: pharma_ecommerce
    networks:
      - pharma_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pharma_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongodb:27017/pharma_ecommerce
      FLASK_ENV: development
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads
    depends_on:
      - mongodb
    networks:
      - pharma_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pharma_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://backend:5000
    depends_on:
      - backend
    networks:
      - pharma_network

volumes:
  mongo_data:
  upload_data:

networks:
  pharma_network:
    driver: bridge
